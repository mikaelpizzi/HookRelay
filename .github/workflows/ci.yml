name: CI — HookRelay

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hookrelay_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d hookrelay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/hookrelay_test
      REDIS_URL: redis://localhost:6379/1
      AWS_ENDPOINT_URL: http://localhost:9297
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_ARCHIVE_BUCKET: hookrelay-test-archives
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build and start AWS Emulator
        run: |
          docker build -t local/aws-emulator:latest ./docker/aws-emulator
          docker run -d -p 9297:9297 --name aws-emulator local/aws-emulator:latest

      - name: Install dependencies
        run: npm ci

      - name: Initialize PostgreSQL database
        run: psql "$DATABASE_URL" -f database/schema.sql

      - name: Generate Prisma client
        run: npx --prefix apps/api prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: E2E / Integration tests
        run: npm run test:e2e

      - name: Build backend and dashboard
        run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform format check
        run: terraform -chdir=infra/terraform fmt -check

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
